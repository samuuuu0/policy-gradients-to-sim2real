[project]
name = "applied-rl-sim2real"
version = "0.1.0"
description = "Sim-to-Real transfer in continuous robotic control via Deep RL. Custom Policy Gradients (REINFORCE/Actor-Critic) and SB3 Domain Randomization."
readme = "README.md"
authors = [
    { name = "samuuuu0", email = "samueletommasi29@gmail.com" }
]
requires-python = ">=3.11, <3.13"
dependencies = [
    "gymnasium[mujoco]>=1.3.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "stable-baselines3[extra]>=2.0.0",
    "tensorboard>=2.21.0",
    "torch>=2.13.0",
]
